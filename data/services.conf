# Service Configuration: name|command|priority
sleep_worker|sleep 300|5
counter_worker|while true; do echo tick; sleep 5; done|6
log_generator|while true; do date >> /tmp/service_log.txt; sleep 3; done|4
cpu_monitor|while true; do uptime; sleep 10; done|7
heartbeat|while true; do echo heartbeat; sleep 2; done|8
